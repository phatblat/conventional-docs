[package]
name = "condoc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Writes the Conventional Docs artifacts and their lifecycle commits."
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
gix = { version = "0.87.1", default-features = false, features = [
  "max-performance-safe",
  "sha1",
] }
jiff = "0.2.35"

[dev-dependencies]
tempfile = "3.27.0"
