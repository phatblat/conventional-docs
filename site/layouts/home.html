{{ define "main" }}
<section class="hero">
  <div class="wrap">
    <h1>{{ site.Title }}</h1>
    {{ with .Params.tagline | default site.Params.tagline }}<p class="tagline">{{ . }}</p>{{ end }}
    {{ with .Params.actions }}
    <div class="actions">
      {{ range . }}
      {{ $item := . }}
      {{ $target := site.GetPage $item.href }}
      <a class="button" href="{{ if $target }}{{ $target.RelPermalink }}{{ else }}{{ $item.href }}{{ end }}">{{ $item.text }}</a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
<div class="wrap prose">
  {{ .Content }}
</div>
{{ end }}
