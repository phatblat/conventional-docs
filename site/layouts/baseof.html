<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}" data-style="{{ site.Params.style }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
