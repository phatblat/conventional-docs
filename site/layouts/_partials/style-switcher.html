<nav
  class="style-switcher"
  aria-label="Preview style"
  data-default-style="{{ site.Params.style }}"
>
  <button type="button" data-style="fixit">FixIt</button>
  <button type="button" data-style="doks">Doks</button>
  <button type="button" data-style="hugoplate">Hugoplate</button>
</nav>
<script>
  (function () {
    var nav = document.currentScript.previousElementSibling;
    var current =
      document.documentElement.getAttribute("data-style") ||
      nav.dataset.defaultStyle;

    function setPressed() {
      nav.querySelectorAll("button").forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.style === current));
      });
    }

    setPressed();

    nav.addEventListener("click", function (event) {
      var btn = event.target.closest("button[data-style]");
      if (!btn || !window.CD_STYLES) return;
      var name = btn.dataset.style;
      var href = window.CD_STYLES[name];
      if (!href) return;
      document.getElementById("site-css").setAttribute("href", href);
      document.documentElement.setAttribute("data-style", name);
      window.localStorage.setItem("cd-style", name);
      current = name;
      setPressed();
    });
  })();
</script>
