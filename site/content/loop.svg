<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">The Conventional Docs loop</title>
  <desc id="loop-desc">Intent leads to a proposed Decision, then review, then an accepted Decision. A Plan is written, executed while the Todo is cached, and the pull request merges. Design is updated, closing the loop back to the next intent.</desc>
  <style>
    .node { fill: #f5f7fa; stroke: #dee2e6; stroke-width: 1.5; }
    .label {
      fill: #14181b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .flow { stroke: #0066cc; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #0066cc; }
    .caption {
      fill: #5c6773;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      text-anchor: middle;
    }
    .caption code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
    </marker>
  </defs>

  <!-- Row 1: intent -> Decision (proposed) -> review -> Decision (accepted) -->
  <rect class="node" x="20" y="30" width="180" height="70" rx="8" />
  <text class="label" x="110" y="65"><tspan x="110" dy="0">Intent</tspan></text>

  <rect class="node" x="260" y="30" width="180" height="70" rx="8" />
  <text class="label" x="350" y="65"><tspan x="350" dy="-0.6em">Decision</tspan><tspan x="350" dy="1.2em">(proposed)</tspan></text>

  <rect class="node" x="500" y="30" width="180" height="70" rx="8" />
  <text class="label" x="590" y="65"><tspan x="590" dy="0">Review</tspan></text>

  <rect class="node" x="740" y="30" width="180" height="70" rx="8" />
  <text class="label" x="830" y="65"><tspan x="830" dy="-0.6em">Decision</tspan><tspan x="830" dy="1.2em">(accepted)</tspan></text>

  <!-- Row 2: Plan written -> execute -> PR merged -> Design updated -->
  <rect class="node" x="740" y="240" width="180" height="70" rx="8" />
  <text class="label" x="830" y="275"><tspan x="830" dy="0">Plan written</tspan></text>

  <rect class="node" x="500" y="240" width="180" height="70" rx="8" />
  <text class="label" x="590" y="275"><tspan x="590" dy="0">Execute</tspan></text>

  <rect class="node" x="260" y="240" width="180" height="70" rx="8" />
  <text class="label" x="350" y="275"><tspan x="350" dy="0">PR merged</tspan></text>

  <rect class="node" x="20" y="240" width="180" height="70" rx="8" />
  <text class="label" x="110" y="275"><tspan x="110" dy="-0.6em">Design</tspan><tspan x="110" dy="1.2em">updated</tspan></text>

  <!-- Row 1 arrows, left to right -->
  <line class="flow" x1="205" y1="65" x2="255" y2="65" marker-end="url(#loop-arrow)" />
  <line class="flow" x1="445" y1="65" x2="495" y2="65" marker-end="url(#loop-arrow)" />
  <line class="flow" x1="685" y1="65" x2="735" y2="65" marker-end="url(#loop-arrow)" />

  <!-- Down the right side: Decision (accepted) -> Plan written -->
  <line class="flow" x1="830" y1="105" x2="830" y2="235" marker-end="url(#loop-arrow)" />

  <!-- Row 2 arrows, right to left -->
  <line class="flow" x1="735" y1="275" x2="685" y2="275" marker-end="url(#loop-arrow)" />
  <line class="flow" x1="495" y1="275" x2="445" y2="275" marker-end="url(#loop-arrow)" />
  <line class="flow" x1="255" y1="275" x2="205" y2="275" marker-end="url(#loop-arrow)" />

  <!-- Up the left side, closing the loop: Design updated -> next Intent -->
  <line class="flow" x1="110" y1="235" x2="110" y2="105" marker-end="url(#loop-arrow)" />

  <text class="caption" x="470" y="337">Todo cached during execute (<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">todo: sync</tspan>)</text>
  <text class="caption" x="470" y="357">Plan and Todo deleted before merge</text>
</svg>
